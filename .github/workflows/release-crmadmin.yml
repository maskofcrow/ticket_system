name: crmadmin sürümü

# crmadmin-v0.1.0 gibi bir etiket gönderildiğinde teknisyen uygulamasının
# Windows kurulumunu (.exe) üretir ve GitHub Release'e ekler.
on:
  push:
    tags: ['crmadmin-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Uygulamayı paketle
        run: npm run --workspace @ticket/crmadmin pack:win
        env:
          # Sertifika secret'ları tanımlıysa imzalanır, yoksa imzasız.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      - name: Kurulum dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: crmadmin-win
          path: |
            apps/crmadmin/release/*.exe
            apps/crmadmin/release/*.blockmap
            apps/crmadmin/release/*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: GitHub sürümü oluştur
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Esta Uzak Yönetim (teknisyen uygulaması)

            - **Windows:** `.exe` dosyasını indirip çalıştırın.
            - Açılışta uzak yönetim hesabınızla giriş yapın; sonra müşteri listesinden
              cihaza tıklayıp ekranı kontrol edin.

            > Uygulama henüz kod imzalı değil; Windows "SmartScreen" uyarısında
            > *Daha fazla bilgi → Yine de çalıştır* deyin.
