name: Masaüstü sürümü

# desktop-v0.1.0 gibi bir etiket gönderildiğinde .dmg ve .exe üretir.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            artifact: macos-dmg
          - os: windows-latest
            platform: win
            artifact: windows-exe

    runs-on: ${{ matrix.os }}

    # mac paketleme imzasız/dmg tarafında kırılgan ve mac auto-update zaten
    # sertifika gerektiriyor. Windows asıl hedef; mac ayağı patlarsa yayını
    # engellemesin (best-effort).
    continue-on-error: ${{ matrix.platform == 'mac' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Uzak destek ajanı (Esta markalı, MeshCentral "EstaClient" grubu, self-contained)
      # — installer'a gömülmek üzere indir. Yalnızca Windows paketlemesinde.
      - name: Uzak destek ajanını indir (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/resources | Out-Null
          $mid = "n4razfX9%24Gc8%40lV5ERREYhKATmPn97iv%24iimMeTGYody3LldgxOdHJ7Y37%403YtzT"
          Invoke-WebRequest -Uri "https://uzak.estabilisim.com/meshagents?id=4&meshid=$mid&installflags=0" -OutFile apps/desktop/resources/meshagent.exe

      - name: Uygulamayı paketle
        run: npm run --workspace @ticket/desktop pack:${{ matrix.platform }}
        env:
          # Güncelleme feed adresi artık electron-builder.yml'de gömülü;
          # ortam değişkeni gerekmiyor.

          # ── İmzalama ───────────────────────────────────────────────────────
          # Bu secret'lar tanımlı değilse build imzasız tamamlanır; sertifikalar
          # alındığında yalnızca GitHub Secrets'a eklemek yeterli, kod değişmez.
          #
          # Windows:  CSC_LINK (base64 .pfx), CSC_KEY_PASSWORD
          # macOS:    CSC_LINK (base64 .p12), CSC_KEY_PASSWORD,
          #           APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Sertifika yokken electron-builder'ın imzalama denemesini atlaması için.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      - name: Kurulum dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # latest*.yml dosyaları otomatik güncelleme için gerekli — kurulum
          # dosyalarıyla birlikte /updates dizinine konmalı.
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # mac ayağı patlasa bile (best-effort) yayın yapılmalı: Windows kurulumu ve
    # latest.yml hazırsa Release oluşsun. Bir tag itildiğinde her hâlükârda çalış.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: GitHub sürümü oluştur
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Kurulum

            - **Windows:** `.exe` dosyasını indirip çalıştırın
            - **macOS:** `.dmg` dosyasını açıp uygulamayı Applications klasörüne sürükleyin

            > Uygulama henüz kod imzalı değil. Windows "SmartScreen" uyarısında
            > *Daha fazla bilgi → Yine de çalıştır*, macOS'te ise uygulamaya sağ
            > tıklayıp *Aç* deyin. Sertifikalar alındığında bu uyarılar kalkacak.
