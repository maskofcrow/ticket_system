name: CI

# Bu depo yalnızca masaüstü istemcisini barındırır; API ve personel paneli
# EstaCRM'e taşındı (estacrm deposu). Bu yüzden CI'da artık veritabanı ve
# nesne deposu servisleri gerekmiyor.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  kontrol:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Lint
        run: npm run lint --if-present

      # Paketleme (dmg/exe) release-desktop.yml'de yapılıyor; burada yalnızca
      # derlemenin bozulmadığını doğruluyoruz.
      - name: Derleme
        run: npm run --workspace @ticket/desktop build
