name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ticket
          POSTGRES_PASSWORD: ticket
          POSTGRES_DB: ticket_system
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']

    env:
      DATABASE_URL: postgresql://ticket:ticket@localhost:5433/ticket_system
      JWT_SECRET: ci-ortami-icin-en-az-32-karakterlik-gizli-anahtar
      LICENSE_PEPPER: ci-ortami-icin-en-az-32-karakterlik-pepper-xx
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ortak paketi derle
        run: npm run build:shared

      - name: Prisma istemcisini üret
        run: npm run --workspace @ticket/api db:generate

      - name: Veritabanı şemasını uygula
        run: npm run --workspace @ticket/api db:deploy

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Testler
        run: npm run --workspace @ticket/api test

      - name: Web panelini derle
        run: npm run --workspace @ticket/web build

      - name: Masaüstü uygulamasını derle
        run: npm run --workspace @ticket/desktop build
