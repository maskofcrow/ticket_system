appId: com.esta.crmadmin
productName: Esta Uzak Yönetim
copyright: © Esta Bilişim

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
asar: true

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: esta-uzak-yonetim-kurulum-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Esta Uzak Yönetim
  runAfterFinish: true

# Kendi güncelleme kanalı — desktop'ın "latest" feed'iyle çakışmasın.
publish:
  provider: generic
  url: https://crm.estabilisim.com/updates/
  channel: crmadmin
